include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by setup.sh with whatever Flutter version is installed.
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - windows/**
    - packages/*/android/**
    - packages/*/ios/**
    - packages/*/linux/**
    - packages/*/macos/**
    - packages/*/windows/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
