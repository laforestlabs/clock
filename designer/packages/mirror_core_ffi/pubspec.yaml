# An FFI plugin whose only job is to compile the repository's render core for
# whichever platform Flutter is targeting, and to bundle the result so
# DynamicLibrary.open can find it at runtime.
#
# It carries no Dart API of its own. The bindings live in the app, at
# designer/lib/src/engine/, because they are the app's concern and keeping
# them there avoids a second package to version.
#
# The platform folders (android, linux, windows, macos, ios) are generated by
# setup.sh using the Flutter version you have installed, rather than checked in,
# so the gradle and podspec boilerplate always matches your toolchain.

name: mirror_core_ffi
description: Builds the smart mirror render core natively for each platform.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
